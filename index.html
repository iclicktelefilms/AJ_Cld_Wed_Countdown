<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HiThatDay – Royal Wedding Calculator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080810;
      --surface:   #0e0e1a;
      --gold:      #C9973A;
      --gold-lt:   #E8C06A;
      --gold-dim:  rgba(201,151,58,0.18);
      --ivory:     #F5EDD8;
      --ivory-dim: rgba(245,237,216,0.55);
      --muted:     rgba(245,237,216,0.28);
      --border:    rgba(201,151,58,0.22);
      --border-hi: rgba(201,151,58,0.55);
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,151,58,0.09) 0%, transparent 100%),
        radial-gradient(ellipse 60% 40% at 15% 100%, rgba(201,151,58,0.05) 0%, transparent 100%);
      font-family: 'Inter', sans-serif;
      color: var(--ivory);
      overflow-x: hidden;
    }

    /* ── Subtle noise texture overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* ── Gold dust particles ── */
    .dust { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .mote {
      position: absolute;
      border-radius: 50%;
      background: var(--gold);
      animation: rise var(--dur) ease-in infinite var(--del);
      opacity: 0;
    }
    @keyframes rise {
      0%   { opacity: 0; transform: translateY(0) scale(1); }
      15%  { opacity: 0.6; }
      85%  { opacity: 0.2; }
      100% { opacity: 0; transform: translateY(-90px) scale(0.4); }
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: 56px 24px 72px;
    }

    /* ── Top rule ── */
    .top-rule {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 52px;
    }
    .rule-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    .rule-center {
      padding: 0 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .rule-diamond {
      width: 7px; height: 7px;
      background: var(--gold);
      transform: rotate(45deg);
    }
    .rule-dots {
      display: flex; gap: 5px;
    }
    .rule-dots span {
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--gold-dim);
      border: 1px solid var(--gold);
    }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 52px; }

    .crown {
      font-size: 2rem;
      display: inline-block;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 16px rgba(201,151,58,0.5));
      animation: glow 3s ease-in-out infinite;
    }
    @keyframes glow {
      0%,100% { filter: drop-shadow(0 0 14px rgba(201,151,58,0.4)); }
      50%      { filter: drop-shadow(0 0 28px rgba(201,151,58,0.75)); }
    }

    .app-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3rem, 8vw, 5rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: linear-gradient(180deg, var(--gold-lt) 0%, var(--gold) 55%, #9a6e1e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 14px;
    }

    .tagline-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 8px;
    }
    .t-line { width: 48px; height: 1px; background: var(--border-hi); }
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--gold);
      letter-spacing: 0.12em;
      font-weight: 300;
    }

    .subtitle {
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 400;
    }

    /* ── Card ── */
    .card {
      background: linear-gradient(160deg, rgba(255,255,255,0.033) 0%, rgba(255,255,255,0.012) 100%);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 44px 40px;
      position: relative;
      box-shadow:
        0 1px 0 rgba(201,151,58,0.15) inset,
        0 40px 80px rgba(0,0,0,0.6);
    }

    /* Corner filigree lines */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 36px; height: 36px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.45;
    }
    .card::before { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
    .card::after  { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }

    /* Extra corner filigree via inner wrapper */
    .card-inner::before, .card-inner::after {
      content: '';
      position: absolute;
      width: 36px; height: 36px;
      border-color: var(--gold);
      border-style: solid;
      opacity: 0.45;
      pointer-events: none;
    }
    .card-inner { position: relative; }
    .card-inner::before { top: -32px; right: -28px; border-width: 1px 1px 0 0; }
    .card-inner::after  { bottom: -32px; left: -28px; border-width: 0 0 1px 1px; }

    /* ── Section label ── */
    .section-label {
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
      margin-bottom: 14px;
    }

    /* ── Toggle ── */
    .toggle-group {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 34px;
    }
    .toggle-btn {
      flex: 1;
      padding: 12px 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s, color 0.25s;
      position: relative;
    }
    .toggle-btn + .toggle-btn { border-left: 1px solid var(--border); }
    .toggle-btn.active {
      background: var(--gold-dim);
      color: var(--gold-lt);
    }
    .toggle-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 1.5px;
      background: var(--gold);
    }

    /* ── Inputs ── */
    .input-section {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: flex-end;
      margin-bottom: 36px;
    }
    .field { flex: 1; min-width: 190px; }

    label {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 9px;
      font-weight: 500;
    }

    input[type="datetime-local"],
    input[type="text"] {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--ivory);
      font-size: 0.93rem;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(0.85) sepia(0.6) saturate(2) hue-rotate(5deg);
      cursor: pointer;
      opacity: 0.7;
    }
    input::placeholder { color: var(--muted); font-weight: 300; }
    input:focus {
      border-color: var(--gold);
      background: rgba(201,151,58,0.05);
      outline: none;
    }

    .calc-btn {
      padding: 13px 32px;
      background: transparent;
      border: 1px solid var(--gold);
      border-radius: 3px;
      color: var(--gold-lt);
      font-size: 0.75rem;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      white-space: nowrap;
      align-self: flex-end;
      position: relative;
      overflow: hidden;
    }
    .calc-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.25s ease;
      z-index: 0;
    }
    .calc-btn:hover::before { transform: scaleX(1); }
    .calc-btn:hover { color: var(--bg); }
    .calc-btn span { position: relative; z-index: 1; }

    /* ── Error ── */
    .error { color: #c97a7a; font-size: 0.8rem; margin-top: 8px; display: none; letter-spacing: 0.04em; }
    .error.visible { display: block; }

    /* ── Divider ── */
    .section-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 30px 0;
    }
    .section-divider .sd-line { flex: 1; height: 1px; background: var(--border); }
    .section-divider .sd-text {
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
      white-space: nowrap;
    }
    .section-divider .sd-diamond {
      width: 5px; height: 5px;
      background: var(--gold);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    /* ── Result label ── */
    .result-label {
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.08rem;
      color: var(--muted);
      margin-bottom: 30px;
      font-weight: 300;
      min-height: 1.5em;
      letter-spacing: 0.02em;
    }
    .result-label strong { color: var(--gold-lt); font-style: normal; font-weight: 600; }

    /* ── Tiles ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 0;
    }

    .tile {
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 26px 10px 22px;
      text-align: center;
      background: rgba(255,255,255,0.018);
      transition: border-color 0.25s, background 0.25s, transform 0.25s;
      position: relative;
      overflow: hidden;
    }
    .tile::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .tile:hover { border-color: var(--border-hi); background: var(--gold-dim); transform: translateY(-3px); }
    .tile:hover::before { opacity: 1; }

    .tile-icon {
      font-size: 1.1rem;
      opacity: 0.6;
      margin-bottom: 10px;
      display: block;
    }
    .tile-value {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 2.6rem;
      color: var(--gold-lt);
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .tile-unit {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    /* ── Live row ── */
    .live-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .live-grid .tile-value { font-size: 2.2rem; }

    /* ── Live badge ── */
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
    }
    .live-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.15;} }

    /* ── Show/hide results ── */
    .results-wrap { display: none; }
    .results-wrap.visible { display: block; animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Footer ── */
    .footer-rule {
      display: flex;
      align-items: center;
      gap: 0;
      margin: 48px 0 20px;
    }
    .footer-rule .rule-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); }

    footer {
      text-align: center;
      font-size: 0.76rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      line-height: 1.9;
    }
    footer a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    footer a:hover { color: var(--gold-lt); }
    .heart { color: #c97a7a; }

    /* ── Responsive ── */
    @media (max-width: 580px) {
      .card { padding: 30px 20px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .live-grid { grid-template-columns: repeat(3, 1fr); }
      .app-name { letter-spacing: 0.1em; }
    }
    @media (max-width: 400px) {
      .grid { grid-template-columns: repeat(2,1fr); }
      .live-grid .tile-value { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

<!-- Gold dust -->
<div class="dust" id="dust"></div>

<div class="page">

  <!-- Top ornamental rule -->
  <div class="top-rule">
    <div class="rule-line"></div>
    <div class="rule-center">
      <div class="rule-diamond"></div>
      <div class="rule-dots"><span></span><span></span><span></span></div>
      <div class="rule-diamond"></div>
    </div>
    <div class="rule-line"></div>
  </div>

  <!-- Header -->
  <header>
    <div class="crown">♛</div>
    <div class="app-name">HiThatDay</div>
    <div class="tagline-wrap">
      <div class="t-line"></div>
      <div class="tagline">Your Royal Wedding Date, Elegantly Measured</div>
      <div class="t-line"></div>
    </div>
    <div class="subtitle">Wedding Date Calculator</div>
  </header>

  <!-- Card -->
  <div class="card">
    <div class="card-inner">

      <!-- Toggle -->
      <div class="section-label">Select Mode</div>
      <div class="toggle-group">
        <button class="toggle-btn active" onclick="setMode('future',this)">Counting Down To</button>
        <button class="toggle-btn" onclick="setMode('past',this)">Celebrating Since</button>
      </div>

      <!-- Inputs -->
      <div class="input-section">
        <div class="field">
          <label for="weddingDate">Wedding Date &amp; Time</label>
          <input type="datetime-local" id="weddingDate" />
        </div>
        <div class="field" style="max-width:230px;">
          <label for="coupleName">Couple's Names <span style="font-size:.8em; text-transform:none; opacity:0.5; letter-spacing:0;">(optional)</span></label>
          <input type="text" id="coupleName" placeholder="e.g. Ananya &amp; Vikram" />
        </div>
        <button class="calc-btn" onclick="calculate()"><span>Calculate</span></button>
      </div>

      <div class="error" id="errorMsg">Please select a valid wedding date and time.</div>

      <!-- Results -->
      <div class="results-wrap" id="resultsWrap">

        <div class="result-label" id="resultLabel"></div>

        <!-- Static tiles -->
        <div class="grid">
          <div class="tile">
            <span class="tile-icon">◈</span>
            <div class="tile-value" id="valYears">0</div>
            <div class="tile-unit">Years</div>
          </div>
          <div class="tile">
            <span class="tile-icon">◈</span>
            <div class="tile-value" id="valMonths">0</div>
            <div class="tile-unit">Months</div>
          </div>
          <div class="tile">
            <span class="tile-icon">◈</span>
            <div class="tile-value" id="valWeeks">0</div>
            <div class="tile-unit">Weeks</div>
          </div>
          <div class="tile">
            <span class="tile-icon">◈</span>
            <div class="tile-value" id="valDays">0</div>
            <div class="tile-unit">Days</div>
          </div>
        </div>

        <div class="section-divider">
          <div class="sd-line"></div>
          <div class="sd-diamond"></div>
          <div class="sd-text">
            Live &nbsp;
            <span class="live-pill"><span class="live-dot"></span> Live</span>
          </div>
          <div class="sd-diamond"></div>
          <div class="sd-line"></div>
        </div>

        <!-- Live tiles -->
        <div class="live-grid">
          <div class="tile">
            <span class="tile-icon">◇</span>
            <div class="tile-value" id="valHours">00</div>
            <div class="tile-unit">Hours</div>
          </div>
          <div class="tile">
            <span class="tile-icon">◇</span>
            <div class="tile-value" id="valMinutes">00</div>
            <div class="tile-unit">Minutes</div>
          </div>
          <div class="tile">
            <span class="tile-icon">◇</span>
            <div class="tile-value" id="valSeconds">00</div>
            <div class="tile-unit">Seconds</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Footer rule -->
  <div class="footer-rule">
    <div class="rule-line"></div>
    <div style="padding: 0 18px; opacity:0.3; font-size:0.7rem; color:var(--gold);">◆</div>
    <div class="rule-line"></div>
  </div>

  <footer>
    Designed with <span class="heart">❤️</span> by
    <a href="https://netwinglabs.com" target="_blank" rel="noopener">NetWing Labs</a>
  </footer>

</div>

<script>
  /* ── Gold dust ── */
  (function () {
    const c = document.getElementById('dust');
    for (let i = 0; i < 40; i++) {
      const m = document.createElement('div');
      m.className = 'mote';
      const sz = 1.5 + Math.random() * 2.5;
      m.style.cssText = `
        left:${Math.random()*100}%;
        top:${30+Math.random()*70}%;
        width:${sz}px; height:${sz}px;
        --dur:${6+Math.random()*8}s;
        --del:-${Math.random()*12}s;
        opacity:0;
      `;
      c.appendChild(m);
    }
  })();

  /* ── State ── */
  let mode = 'future';
  let targetDate = null;
  let ticker = null;

  function setMode(m, btn) {
    mode = m;
    document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (targetDate) calculate();
  }

  /* Default: tomorrow noon */
  (function () {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    d.setHours(12, 0, 0, 0);
    document.getElementById('weddingDate').value = toLocalISO(d);
  })();

  function toLocalISO(d) {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function calculate() {
    const val  = document.getElementById('weddingDate').value;
    const err  = document.getElementById('errorMsg');
    const wrap = document.getElementById('resultsWrap');
    if (!val) { err.classList.add('visible'); return; }
    err.classList.remove('visible');
    targetDate = new Date(val);
    if (isNaN(targetDate)) { err.classList.add('visible'); return; }

    wrap.classList.remove('visible');
    void wrap.offsetWidth;
    wrap.classList.add('visible');

    updateLabel();
    updateStatic();
    if (ticker) clearInterval(ticker);
    ticker = setInterval(updateLive, 1000);
    updateLive();
  }

  function updateLabel() {
    const name = document.getElementById('coupleName').value.trim();
    const lbl  = document.getElementById('resultLabel');
    const ds   = targetDate.toLocaleDateString('en-IN', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    lbl.innerHTML = mode === 'future'
      ? (name ? `<strong>${name}</strong>'s wedding is on ${ds}` : `Your wedding is on <strong>${ds}</strong>`)
      : (name ? `<strong>${name}</strong> have been married since ${ds}` : `Married since <strong>${ds}</strong>`);
  }

  function diffComponents(from, to) {
    let y = to.getFullYear() - from.getFullYear();
    let mo = to.getMonth()   - from.getMonth();
    let d  = to.getDate()    - from.getDate();
    if (d  < 0) { mo--; d  += new Date(to.getFullYear(), to.getMonth(), 0).getDate(); }
    if (mo < 0) { y--;  mo += 12; }
    return { years: y, months: mo, days: d };
  }

  function updateStatic() {
    const now = new Date();
    const absMs = Math.abs(targetDate - now);
    const totalDays = Math.floor(absMs / 86400000);
    const comp = mode === 'future'
      ? diffComponents(now, targetDate)
      : diffComponents(targetDate, now);
    document.getElementById('valYears').textContent  = comp.years;
    document.getElementById('valMonths').textContent = comp.months;
    document.getElementById('valWeeks').textContent  = Math.floor(totalDays / 7);
    document.getElementById('valDays').textContent   = totalDays;
  }

  function updateLive() {
    const now = new Date();
    const abs = Math.max(0, mode === 'future' ? targetDate - now : now - targetDate);
    const s   = Math.floor(abs / 1000);
    document.getElementById('valHours').textContent   = String(Math.floor(s / 3600) % 24).padStart(2, '0');
    document.getElementById('valMinutes').textContent = String(Math.floor(s / 60) % 60).padStart(2, '0');
    document.getElementById('valSeconds').textContent = String(s % 60).padStart(2, '0');
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HiThatDay – Wedding Date Calculator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=DM+Sans:wght@300;400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #FAF7F4;
      --white:     #FFFFFF;
      --charcoal:  #1C1410;
      --taupe:     #7A6A58;
      --taupe-lt:  #B5A898;
      --gold:      #B8893A;
      --gold-lt:   #D4A852;
      --rose:      #C8787E;
      --blush:     #F5E6E2;
      --blush-lt:  #FBF1EE;
      --border:    rgba(28,20,16,0.1);
      --shadow-sm: 0 2px 16px rgba(28,20,16,0.06);
      --shadow-md: 0 8px 48px rgba(28,20,16,0.09);
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--charcoal);
      overflow-x: hidden;
    }

    /* ── Subtle corner florals ── */
    .deco { position: fixed; pointer-events: none; z-index: 0; opacity: 0.13; }
    .deco-tl { top: -20px; left: -20px; width: clamp(180px, 24vw, 300px); }
    .deco-br { bottom: -20px; right: -20px; width: clamp(180px, 24vw, 300px); transform: rotate(180deg); }

    /* ── Page ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 80px;
    }

    /* ── Hero header ── */
    .hero {
      text-align: center;
      margin-bottom: 52px;
      max-width: 640px;
    }

    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .eyebrow::before, .eyebrow::after {
      content: '';
      width: 32px;
      height: 1px;
      background: var(--gold);
      opacity: 0.6;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(3.2rem, 9vw, 6rem);
      color: var(--charcoal);
      line-height: 1.0;
      letter-spacing: -0.01em;
      margin-bottom: 18px;
    }

    .tagline {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: var(--taupe);
      letter-spacing: 0.02em;
      line-height: 1.6;
    }

    /* ── Input card ── */
    .card {
      width: 100%;
      max-width: 680px;
      background: var(--white);
      border-radius: 24px;
      padding: 40px 40px 36px;
      box-shadow: var(--shadow-md);
      margin-bottom: 32px;
    }

    /* Toggle */
    .toggle-wrap {
      display: flex;
      background: var(--bg);
      border-radius: 50px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 32px;
    }
    .toggle-btn {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 50px;
      background: transparent;
      color: var(--taupe);
      font-size: 0.8rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.22s ease;
    }
    .toggle-btn.active {
      background: var(--charcoal);
      color: var(--white);
      box-shadow: 0 2px 12px rgba(28,20,16,0.2);
    }

    /* Fields */
    .fields {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }
    .field { flex: 1; min-width: 180px; }

    label {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--taupe);
      font-weight: 600;
      margin-bottom: 8px;
    }

    input[type="date"],
    input[type="text"] {
      width: 100%;
      padding: 13px 18px;
      background: var(--bg);
      border: 1.5px solid transparent;
      border-radius: 50px;
      color: var(--charcoal);
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      opacity: 0.4;
    }
    input::placeholder { color: var(--taupe-lt); }
    input:focus {
      border-color: var(--gold);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(184,137,58,0.08);
    }

    .btn {
      width: 100%;
      padding: 15px 24px;
      background: var(--charcoal);
      border: none;
      border-radius: 50px;
      color: var(--white);
      font-size: 0.82rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(28,20,16,0.18);
    }
    .btn:hover {
      background: var(--gold);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(184,137,58,0.3);
    }
    .btn:active { transform: translateY(0); }

    .error {
      font-size: 0.82rem;
      color: var(--rose);
      margin-top: 12px;
      text-align: center;
      display: none;
      font-style: italic;
    }
    .error.visible { display: block; }

    /* ── Results ── */
    .results-wrap { display: none; width: 100%; max-width: 680px; }
    .results-wrap.visible {
      display: block;
      animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-headline {
      text-align: center;
      margin-bottom: 28px;
    }
    .result-headline p {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1rem, 2.5vw, 1.18rem);
      color: var(--taupe);
      line-height: 1.6;
    }
    .result-headline strong {
      font-style: normal;
      color: var(--charcoal);
      font-weight: 500;
    }

    /* Stat tiles */
    .tiles-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }

    .tile {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 28px 10px 22px;
      text-align: center;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow-sm);
    }
    .tile:hover {
      border-color: rgba(184,137,58,0.35);
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(28,20,16,0.09);
    }

    .tile-num {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: clamp(2.2rem, 4.5vw, 3rem);
      color: var(--charcoal);
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .tile-lbl {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--taupe-lt);
      font-weight: 600;
    }

    /* Live section */
    .live-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 24px 0 14px;
    }
    .live-header .lh-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .live-header .lh-label {
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--taupe-lt);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--rose);
      animation: pulse 1.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.3; transform:scale(0.7);} }

    .live-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 12px;
    }
    .live-grid .tile {
      background: var(--blush-lt);
      border-color: rgba(200,120,126,0.15);
    }
    .live-grid .tile:hover {
      border-color: rgba(200,120,126,0.35);
    }
    .live-grid .tile-num {
      font-size: clamp(1.9rem, 4vw, 2.6rem);
      color: var(--charcoal);
    }

    /* ── Footer ── */
    footer {
      margin-top: 52px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--taupe-lt);
      letter-spacing: 0.04em;
    }
    footer a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    footer a:hover { color: var(--charcoal); }
    .heart { color: var(--rose); }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      .card { padding: 28px 20px 24px; }
      .tiles-grid { grid-template-columns: repeat(2,1fr); }
      .live-grid { grid-template-columns: repeat(3,1fr); }
    }
    @media (max-width: 360px) {
      .live-grid .tile-num { font-size: 1.6rem; }
    }
  </style>
</head>

<div class="page">

  <!-- Hero -->
  <div class="hero">
    <div class="eyebrow">Wedding Date Calculator</div>
    <h1 class="title">HiThatDay</h1>
    <p class="tagline">Enter your wedding date and discover exactly<br/>how long until — or since — your special day</p>
  </div>

  <!-- Input card -->
  <div class="card">

    <div class="toggle-wrap">
      <button class="toggle-btn active" onclick="setMode('future',this)">Counting Down To</button>
      <button class="toggle-btn" onclick="setMode('past',this)">Celebrating Since</button>
    </div>

    <div class="fields">
      <div class="field">
        <label for="weddingDate">Wedding Date</label>
        <input type="date" id="weddingDate"/>
      </div>
      <div class="field">
        <label for="coupleName">
          Names
          <span style="font-size:.85em;text-transform:none;letter-spacing:0;opacity:0.6;font-weight:400;">(optional)</span>
        </label>
        <input type="text" id="coupleName" placeholder="e.g. Priya &amp; Arjun"/>
      </div>
    </div>

    <button class="btn" onclick="calculate()">Calculate</button>
    <div class="error" id="errorMsg">Please select a valid wedding date.</div>

  </div>

  <!-- Results -->
  <div class="results-wrap" id="resultsWrap">

    <div class="result-headline">
      <p id="resultLabel"></p>
    </div>

    <div class="tiles-grid">
      <div class="tile">
        <div class="tile-num" id="valYears">0</div>
        <div class="tile-lbl">Years</div>
      </div>
      <div class="tile">
        <div class="tile-num" id="valMonths">0</div>
        <div class="tile-lbl">Months</div>
      </div>
      <div class="tile">
        <div class="tile-num" id="valWeeks">0</div>
        <div class="tile-lbl">Weeks</div>
      </div>
      <div class="tile">
        <div class="tile-num" id="valDays">0</div>
        <div class="tile-lbl">Days</div>
      </div>
    </div>

    <div class="live-header">
      <div class="lh-line"></div>
      <div class="lh-label"><span class="live-dot"></span>Live Countdown</div>
      <div class="lh-line"></div>
    </div>

    <div class="live-grid">
      <div class="tile">
        <div class="tile-num" id="valHours">00</div>
        <div class="tile-lbl">Hours</div>
      </div>
      <div class="tile">
        <div class="tile-num" id="valMinutes">00</div>
        <div class="tile-lbl">Minutes</div>
      </div>
      <div class="tile">
        <div class="tile-num" id="valSeconds">00</div>
        <div class="tile-lbl">Seconds</div>
      </div>
    </div>

  </div>

  <footer>
    Designed with <span class="heart">❤️</span> by
    <a href="https://netwinglabs.com" target="_blank" rel="noopener">NetWing Labs</a>
  </footer>

</div>

<script>
  let mode = 'future';
  let targetDate = null;
  let ticker = null;

  /* Default: tomorrow */
  (function () {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    const p = n => String(n).padStart(2,'0');
    document.getElementById('weddingDate').value =
      `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  })();

  function setMode(m, btn) {
    mode = m;
    document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (targetDate) calculate();
  }

  function calculate() {
    const val  = document.getElementById('weddingDate').value;
    const err  = document.getElementById('errorMsg');
    const wrap = document.getElementById('resultsWrap');
    if (!val) { err.classList.add('visible'); return; }
    err.classList.remove('visible');
    targetDate = new Date(val + 'T00:00:00');
    if (isNaN(targetDate)) { err.classList.add('visible'); return; }
    wrap.classList.remove('visible');
    void wrap.offsetWidth;
    wrap.classList.add('visible');
    updateLabel(); updateStatic();
    if (ticker) clearInterval(ticker);
    ticker = setInterval(updateLive, 1000);
    updateLive();
  }

  function updateLabel() {
    const name = document.getElementById('coupleName').value.trim();
    const lbl  = document.getElementById('resultLabel');
    const ds   = targetDate.toLocaleDateString('en-IN', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    lbl.innerHTML = mode === 'future'
      ? (name
          ? `<strong>${name}</strong>'s wedding is on ${ds}`
          : `Your wedding is on <strong>${ds}</strong>`)
      : (name
          ? `<strong>${name}</strong> have been married since ${ds}`
          : `Married since <strong>${ds}</strong>`);
  }

  function diffComponents(from, to) {
    let y  = to.getFullYear() - from.getFullYear();
    let mo = to.getMonth()    - from.getMonth();
    let d  = to.getDate()     - from.getDate();
    if (d  < 0) { mo--; d  += new Date(to.getFullYear(), to.getMonth(), 0).getDate(); }
    if (mo < 0) { y--;  mo += 12; }
    return { years: y, months: mo };
  }

  function updateStatic() {
    const now     = new Date();
    const absMs   = Math.abs(targetDate - now);
    const totalDays = Math.floor(absMs / 86400000);
    const comp    = mode === 'future'
      ? diffComponents(now, targetDate)
      : diffComponents(targetDate, now);
    document.getElementById('valYears').textContent  = comp.years;
    document.getElementById('valMonths').textContent = comp.months;
    document.getElementById('valWeeks').textContent  = Math.floor(totalDays / 7);
    document.getElementById('valDays').textContent   = totalDays;
  }

  function updateLive() {
    const now = new Date();
    const abs = Math.max(0, mode === 'future' ? targetDate - now : now - targetDate);
    const s   = Math.floor(abs / 1000);
    document.getElementById('valHours').textContent   = String(Math.floor(s / 3600) % 24).padStart(2,'0');
    document.getElementById('valMinutes').textContent = String(Math.floor(s / 60) % 60).padStart(2,'0');
    document.getElementById('valSeconds').textContent = String(s % 60).padStart(2,'0');
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
</script>
